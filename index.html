после доты?","📊 опрос открыт: что смотрим после доты?. голосуйте, потом не жалуйтесь"]},{"name":"название","g":"модерам","desc":"сменить название стрима","usage":"!название текст","mod":true,"s":["✏️ название: алкострим · ряльна","✏️ новое название: алкострим · ряльна"]},{"name":"категория","g":"модерам","desc":"сменить категорию","usage":"!категория Dota 2","mod":true,"s":["🎮 категория: Just Chatting","🎮 переехали в Just Chatting"]},{"name":"клип","g":"модерам","desc":"клип последних секунд","usage":"!клип","mod":true,"s":["🎬 клип готов: clips.twitch.tv/…","🎬 это надо сохранить. клип: clips.twitch.tv/…","🎬 сохранил на память: clips.twitch.tv/…"]},{"name":"метка","g":"модерам","desc":"метка в записи стрима","usage":"!метка","mod":true,"s":["📍 метка стоит. потом найдём этот момент","📍 отметил. в записи будет видно, где это было"]},{"name":"so","g":"модерам","desc":"позвать чат к другому стримеру","usage":"!so @ник","mod":true,"s":["🔥 заходите к {T} → twitch.tv/друг · там тоже хорошие люди 🫶","🔥 {T} — свои. заглядывайте → twitch.tv/друг"]}],"groups":[{"key":"измерения","title":"измерения","icon":"🎮","lead":"Бот меряет человека: число, шкала и комментарий. Без @ник — меряет тебя.","n":"01"},{"key":"люди","title":"про людей","icon":"🧩","lead":"Короткий портрет человека из чата. Можно про себя, можно про друга.","n":"02"},{"key":"нежности","title":"нежности","icon":"💞","lead":"Тёплое. Если никого не отметить, бот выберет человека из чата сам.","n":"03"},{"key":"стрим","title":"про стрим","icon":"🎬","lead":"Про Фила, чат и то, что происходит в эфире.","n":"04"},{"key":"аура","title":"аура и игры","icon":"✨","lead":"Аура копится за общение в чате. Её можно проиграть в казино или в дуэли.","n":"05"},{"key":"канал","title":"канал","icon":"📎","lead":"Ссылки и правила.","n":"06"},{"key":"модерам","title":"модерам","icon":"🛠","lead":"Работает только у модеров и Фила. Полный список в чате — !модкоманды.","n":"07"}],"fil":"Фил"};
const ME='@ты', FRIEND='@друг';
const rnd=n=>Math.random()*n|0, pick=a=>a[rnd(a.length)];
const plural=(n,a,b,c)=>{const m=n%100,d=m%10;return n+' '+(m>10&&m<20?c:d===1?a:d>=2&&d<=4?b:c)};
function fill(s,v){return String(s).replace(/\{n:([^|}]*)\|([^|}]*)\|([^}]*)\}/g,(_,a,b,c)=>plural(+v.n||0,a,b,c))
  .replace(/\{u\}|\{U\}/g,ME).replace(/\{t\}|\{T\}/g,v.t||FRIEND).replace(/\{a\}/g,ME).replace(/\{b\}/g,FRIEND)
  .replace(/\{n\}/g,v.n??'').replace(/\{x\}/g,v.x??'').replace(/\{фил\}/g,DATA.fil).replace(/\{бот\}/g,'Web3').replace(/\s{2,}/g,' ').trim()}
// те же правила, что у бота (src/brain.js → runContent, casino)
function sample(it){
  if(it.s) return fill(pick(it.s),{});
  const d=it.d, t=/@ник/.test(it.usage)?FRIEND:ME;
  if(d.type==='m'||d.type==='pm'){
    const n=rnd(d.max+1), tier=n===0?3:n===d.max?4:n<d.k[0]?0:n<d.k[1]?1:2;
    let v='';
    if(d.vv) v=pick(d.vv[tier]);
    else if(d.f){const k=(d.f[1]===''?Math.ceil:Math.round)(n/d.max*d.f[2]);v=d.f[3]+d.f[0].repeat(k)+d.f[1].repeat(d.f[2]-k)+d.f[4]}
    return fill(d.t.replace('{n}',n).replace('{v}',v).replace('{c}',pick(d.c[tier])),{t});
  }
  if(d.type==='p'||d.type==='pl') return fill(pick(d.r&&Math.random()<.15?d.r:d.l),{t});
  if(d.type==='pp') return fill(pick(d.l),{});
  if(d.type==='act') return ME+' '+d.v+' '+FRIEND+' — '+pick(d.l);
  if(d.type==='casino'){
    const x=Math.random();let i=0;while(x>d.e[i][0])i++;const k=d.e[i][1];
    const s=[...d.s].sort(()=>Math.random()-.5),f=pick(d.f);
    const reels=d.e[i][2]||(k==='l'?s.slice(0,3):k==='w'?[s[0],s[0],s[1]].sort(()=>Math.random()-.5):[f,f,f]).join(' | ');
    const bet=50,win=k==='l'?0:Math.round(bet*d.m[k]),net=win-bet;
    return '🎰 '+ME+' ставит '+bet+' ауры: [ '+reels+' ] — '+fill(pick(d.o[k]),{})+' · '+(net>=0?'+'+net:'−'+(-net))+' ауры';
  }
  return '';
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let cat='all';
const chips=document.getElementById('chips'), list=document.getElementById('list'), q=document.getElementById('q');
const CH=[['all','Все'],...DATA.groups.map(g=>[g.key,g.icon+' '+g.title])];
chips.innerHTML=CH.map(([k,t])=>'<button class="chip sl" data-k="'+k+'" aria-pressed="'+(k===cat)+'"><svg class="check" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>'+esc(t)+'</button>').join('');
chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.k;chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===cat));draw()};
q.oninput=draw;
function card(it,i){
  const ex=sample(it);
  return '<article class="card" style="animation-delay:'+Math.min(i*25,300)+'ms" data-n="'+esc(it.name)+'">'
   +'<div class="card-head"><span class="cmd">!'+esc(it.name)+'</span>'+(it.mod?'<span class="badge mod">модерам</span>':/@ник/.test(it.usage)?'<span class="badge">@ник</span>':'')
   +'<span class="spacer"></span><button class="icon-btn sl copy" aria-label="Скопировать '+esc(it.usage)+'" title="Скопировать"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg></button></div>'
   +'<p class="desc">'+esc(it.desc)+'</p><span class="usage">'+esc(it.usage)+'</span>'
   +(ex?'<div class="bubble"><span class="who">web3</span><span class="txt">'+esc(ex)+'</span></div><div class="actions"><button class="text-btn sl more">ещё пример</button></div>':'')
   +'</article>';
}
function draw(){
  const s=q.value.trim().toLowerCase().replace(/^!/,'');
  const items=DATA.items.filter(it=>(cat==='all'||it.g===cat)&&(!s||it.name.includes(s)||it.desc.toLowerCase().includes(s)));
  if(!items.length){list.innerHTML='<div class="empty">Такой команды нет. Список в чате — !команды</div>';return}
  let html='',i=0;
  for(const g of DATA.groups){
    const its=items.filter(it=>it.g===g.key);if(!its.length)continue;
    html+='<div class="sec"><span class="n">'+g.n+'</span><span class="t">'+esc(g.title)+'</span></div>'+(g.lead&&!s?'<p class="lead2">'+esc(g.lead)+'</p>':'')+'<div class="grid">'+its.map(it=>card(it,i++)).join('')+'</div>';
  }
  list.innerHTML=html;
}
list.onclick=e=>{
  const c=e.target.closest('.card');if(!c)return;const it=DATA.items.find(x=>x.name===c.dataset.n);
  if(e.target.closest('.more')){const b=c.querySelector('.bubble');b.classList.add('swap');const cur=b.querySelector('.txt').textContent;let t=cur;for(let k=0;k<8&&t===cur;k++)t=sample(it);setTimeout(()=>{b.querySelector('.txt').textContent=t;b.classList.remove('swap')},160)}
  if(e.target.closest('.copy')){navigator.clipboard?.writeText(it.usage).then(()=>toast('Скопировано: '+it.usage),()=>toast(it.usage))}
};
let tt;function toast(t){const s=document.getElementById('snack');s.textContent=t;s.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>s.classList.remove('show'),1800)}
const bar=document.getElementById('appbar');addEventListener('scroll',()=>bar.classList.toggle('scrolled',scrollY>40),{passive:true});
draw();
</script>
