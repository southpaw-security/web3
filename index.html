:root{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}

const chips=document.getElementById('chips'), list=document.getElementById('list'), q=document.getElementById('q');
const CH=[['all','Все'],...DATA.groups.map(g=>[g.key,g.icon+' '+g.title])];
chips.innerHTML=CH.map(([k,t])=>'<button class="chip sl" data-k="'+k+'" aria-pressed="'+(k===cat)+'"><svg class="check" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/></svg>'+esc(t)+'</button>').join('');
chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.k;chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===cat));draw()};
q.oninput=draw;
function card(it,i){
  const ex=sample(it);
  return '<article class="card" style="animation-delay:'+Math.min(i*25,300)+'ms" data-n="'+esc(it.name)+'">'
   +'<div class="card-head"><span class="cmd">!'+esc(it.name)+'</span>'+(it.mod?'<span class="badge mod">модерам</span>':/@ник/.test(it.usage)?'<span class="badge">@ник</span>':'')
   +'<span class="spacer"></span><button class="icon-btn sl copy" aria-label="Скопировать '+esc(it.usage)+'" title="Скопировать"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg></button></div>'
   +'<p class="desc">'+esc(it.desc)+'</p><span class="usage">'+esc(it.usage)+'</span>'
   +(ex?'<div class="bubble"><span class="who">web3</span><span class="txt">'+esc(ex)+'</span></div><div class="actions"><button class="text-btn sl more">ещё пример</button></div>':'')
   +'</article>';
}
function draw(){
  const s=q.value.trim().toLowerCase().replace(/^!/,'');
  const items=DATA.items.filter(it=>(cat==='all'||it.g===cat)&&(!s||it.name.includes(s)||it.desc.toLowerCase().includes(s)));
  if(!items.length){list.innerHTML='<div class="empty">Такой команды нет. Список в чате — !команды</div>';return}
  let html='',i=0;
  for(const g of DATA.groups){
    const its=items.filter(it=>it.g===g.key);if(!its.length)continue;
    html+='<div class="sec"><span class="n">'+g.n+'</span><span class="t">'+esc(g.title)+'</span></div>'+(g.lead&&!s?'<p class="lead2">'+esc(g.lead)+'</p>':'')+'<div class="grid">'+its.map(it=>card(it,i++)).join('')+'</div>';
  }
  list.innerHTML=html;
}
list.onclick=e=>{
  const c=e.target.closest('.card');if(!c)return;const it=DATA.items.find(x=>x.name===c.dataset.n);
  if(e.target.closest('.more')){const b=c.querySelector('.bubble');b.classList.add('swap');const cur=b.querySelector('.txt').textContent;let t=cur;for(let k=0;k<8&&t===cur;k++)t=sample(it);setTimeout(()=>{b.querySelector('.txt').textContent=t;b.classList.remove('swap')},160)}
  if(e.target.closest('.copy')){navigator.clipboard?.writeText(it.usage).then(()=>toast('Скопировано: '+it.usage),()=>toast(it.usage))}
};
let tt;function toast(t){const s=document.getElementById('snack');s.textContent=t;s.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>s.classList.remove('show'),1800)}
const bar=document.getElementById('appbar');addEventListener('scroll',()=>bar.classList.toggle('scrolled',scrollY>40),{passive:true});
draw();
</script>
</body>
</html>
